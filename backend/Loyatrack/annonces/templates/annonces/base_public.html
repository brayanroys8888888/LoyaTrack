<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Loyatrack · Logements{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}Trouvez un logement à louer au Cameroun sur Loyatrack — annonces vérifiées.{% endblock %}">
  {% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}
  {% block robots %}{% endblock %}
  {% block jsonld %}{% endblock %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}Loyatrack · Logements{% endblock %}">
  <style>
    :root {
      --ink:#0f172a; --muted:#64748b; --soft:#94a3b8; --line:#e8ecf2; --bg:#f5f7fb; --card:#fff;
      --blue:#1558d6; --blue-d:#0e3fa3; --green:#1f9d55; --amber:#f0b429;
      --radius:18px; --shadow:0 6px 22px rgba(15,23,42,.06); --shadow-h:0 16px 40px rgba(15,23,42,.14);
    }
    * { box-sizing:border-box; }
    body { font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; letter-spacing:-.01em; }
    a { color:inherit; text-decoration:none; }
    .ic { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
    /* Header */
    .nav { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.82); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
    .nav-in { max-width:1080px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:10px; }
    .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:17px; letter-spacing:-.02em; }
    .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--blue),var(--green)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; }
    .brand small { color:var(--muted); font-weight:600; font-size:13px; }
    .nav-cta { margin-left:auto; font-size:13px; font-weight:700; color:var(--blue); border:1px solid var(--line); padding:8px 14px; border-radius:999px; }
    /* Layout */
    .wrap { max-width:1080px; margin:0 auto; padding:22px 20px 8px; }
    .fil { font-size:12.5px; color:var(--soft); margin-bottom:14px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .fil a { color:var(--muted); font-weight:600; }
    h1 { font-size:26px; line-height:1.15; letter-spacing:-.03em; margin:2px 0 8px; }
    h2 { font-size:18px; letter-spacing:-.02em; margin:26px 0 12px; }
    .intro { color:var(--muted); font-size:15px; margin:0 0 18px; }
    /* Search */
    .search { display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr auto; gap:10px; background:var(--card); padding:14px; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line); }
    .search select, .search input { padding:12px 13px; border:1px solid var(--line); border-radius:12px; font:inherit; font-size:14px; background:#fff; color:var(--ink); width:100%; }
    .search button { display:flex; align-items:center; justify-content:center; gap:7px; background:var(--blue); color:#fff; border:none; border-radius:12px; padding:12px 20px; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; }
    .search button:hover { background:var(--blue-d); }
    @media (max-width:720px){ .search { grid-template-columns:1fr 1fr; } .search button { grid-column:1/-1; } }
    /* Chips */
    .chips { display:flex; flex-wrap:wrap; gap:9px; margin-bottom:18px; }
    .chips a { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:9px 15px; font-size:13.5px; font-weight:600; color:var(--ink); box-shadow:var(--shadow); transition:.15s; }
    .chips a:hover { border-color:var(--blue); color:var(--blue); transform:translateY(-1px); }
    .chips a b { color:var(--soft); font-weight:600; }
    /* Grid & cards */
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
    .card { background:var(--card); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--line); display:block; transition:transform .18s, box-shadow .18s; }
    .card:hover { transform:translateY(-4px); box-shadow:var(--shadow-h); }
    .card .ph { position:relative; aspect-ratio:4/3; background:#e7ecf3; }
    .card .ph img { width:100%; height:100%; object-fit:cover; display:block; }
    .card .ph .noimg { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:34px; color:#b6c0cd; }
    .verif { position:absolute; top:10px; left:10px; display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,.94); color:var(--green); font-size:11px; font-weight:700; padding:5px 9px; border-radius:999px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
    .verif .ic { width:13px; height:13px; }
    .tag { position:absolute; top:10px; right:10px; background:rgba(15,23,42,.72); color:#fff; font-size:11px; font-weight:700; padding:5px 9px; border-radius:999px; text-transform:capitalize; }
    .card .body { padding:13px 14px 15px; }
    .card .price { font-size:19px; font-weight:800; letter-spacing:-.02em; }
    .card .price span { font-size:12px; font-weight:600; color:var(--soft); }
    .card .ct { font-weight:700; font-size:14.5px; margin:5px 0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .card .loc { display:flex; align-items:center; gap:5px; color:var(--muted); font-size:12.5px; margin-bottom:9px; }
    .card .loc .ic { width:13px; height:13px; color:var(--soft); }
    .specs { display:flex; gap:12px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:9px; }
    .specs b { color:var(--ink); }
    /* Pagination */
    .pagination { display:flex; gap:12px; align-items:center; justify-content:center; margin:26px 0; color:var(--muted); font-size:14px; }
    .pagination a { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-weight:700; color:var(--blue); box-shadow:var(--shadow); }
    .vide { color:var(--soft); text-align:center; padding:44px 0; }
    /* Forms (contact / signalement) */
    .panel { background:var(--card); padding:20px; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line); display:flex; flex-direction:column; gap:14px; max-width:460px; }
    .panel label { font-size:13px; font-weight:700; color:var(--muted); display:flex; flex-direction:column; gap:7px; }
    .panel input, .panel textarea { padding:12px 13px; border:1px solid var(--line); border-radius:12px; font:inherit; font-size:15px; color:var(--ink); background:#fff; }
    .panel button { background:var(--blue); color:#fff; border:none; border-radius:12px; padding:14px; font-weight:700; font-size:15px; cursor:pointer; }
    .panel button:hover { background:var(--blue-d); }
    .hint { font-size:12.5px; color:var(--soft); margin:0; }
    .err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; border-radius:12px; padding:11px 13px; font-size:13.5px; margin-bottom:14px; max-width:460px; }
    .avert { background:#fffbeb; border:1px solid #fde68a; color:#92610a; border-radius:14px; padding:13px 15px; font-size:13px; margin-bottom:16px; max-width:560px; }
    /* Thread */
    .thread { display:flex; flex-direction:column; gap:9px; margin-bottom:18px; max-width:560px; }
    .msg { max-width:80%; padding:11px 13px; border-radius:16px; font-size:14px; line-height:1.4; }
    .msg .mt { font-size:10.5px; color:var(--soft); margin-top:4px; }
    .msg.moi { align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:5px; }
    .msg.moi .mt { color:#c9dbff; }
    .msg.lui { align-self:flex-start; background:var(--card); box-shadow:var(--shadow); border:1px solid var(--line); border-bottom-left-radius:5px; }
    /* Hero */
    .hero { position:relative; overflow:hidden; background:linear-gradient(135deg,#0e3fa3,#1558d6 52%,#1f9d55); color:#fff; border-radius:24px; padding:46px 32px; margin-bottom:16px; box-shadow:var(--shadow); }
    .hero::after { content:""; position:absolute; right:-60px; top:-60px; width:240px; height:240px; background:rgba(255,255,255,.10); border-radius:50%; }
    .hero h1 { font-size:33px; margin:0 0 10px; letter-spacing:-.03em; color:#fff; }
    .hero p { color:rgba(255,255,255,.92); font-size:15.5px; margin:0; max-width:520px; }
    @media (max-width:560px){ .hero{ padding:34px 22px } .hero h1{ font-size:26px } h1{ font-size:22px } }
    /* Conversations list */
    .convlist { display:flex; flex-direction:column; gap:10px; max-width:620px; }
    .convitem { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); transition:.15s; }
    .convitem:hover { border-color:var(--blue); transform:translateY(-1px); }
    .convitem .ci { flex:1; min-width:0; }
    .convitem .ct { font-weight:700; font-size:14.5px; }
    .convitem .cp { color:var(--muted); font-size:13px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .convitem .ic { color:var(--soft); }
    .foot { border-top:1px solid var(--line); margin-top:36px; }
    .foot-in { max-width:1080px; margin:0 auto; padding:24px 20px; color:var(--soft); font-size:13px; display:flex; gap:8px; align-items:center; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  </svg>

  <header class="nav">
    <div class="nav-in">
      <a class="brand" href="/logements/">
        <span class="logo">L</span>
        <span>Loyatrack <small>Logements</small></span>
      </a>
      <a class="nav-cta" href="/logements/recherche/">Rechercher</a>
    </div>
  </header>

  <main class="wrap">{% block content %}{% endblock %}</main>

  <footer class="foot"><div class="foot-in">© Loyatrack — location au Cameroun. Annonces publiées par des bailleurs vérifiés.</div></footer>
</body>
</html>
