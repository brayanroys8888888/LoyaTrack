<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Loyatrack · Logements{% endblock %}</title>
  <meta name="description" content="{% block meta_desc %}Trouvez un logement à louer au Cameroun sur Loyatrack — annonces vérifiées.{% endblock %}">
  {% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}
  {% block robots %}{% endblock %}
  {% block jsonld %}{% endblock %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}Loyatrack · Logements{% endblock %}">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f4f6f8; color: #1a2233; }
    a { color: inherit; text-decoration: none; }
    .topbar { display:block; background: linear-gradient(135deg,#1565C0,#2E7D32); color:#fff; padding: 14px 16px; font-weight: 700; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
    .fil { font-size: 12px; color:#667; margin-bottom: 10px; }
    .fil a { color:#1565C0; }
    h1 { font-size: 21px; margin: 4px 0 6px; }
    h2 { font-size: 16px; margin: 22px 0 10px; }
    .intro { color:#556; font-size: 14px; margin: 0 0 14px; }
    .recherche { display:flex; flex-wrap:wrap; gap:8px; background:#fff; padding:12px; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); margin-bottom:16px; }
    .recherche select, .recherche input { flex:1 1 120px; min-width:110px; padding:10px; border:1px solid #dfe4ea; border-radius:10px; font-size:14px; background:#fff; color:#1a2233; }
    .recherche button { flex:1 1 120px; background:#1565C0; color:#fff; border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:14px; cursor:pointer; }
    .puces { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .puces a { background:#fff; border:1px solid #dfe4ea; border-radius:20px; padding:6px 12px; font-size:13px; color:#1565C0; font-weight:600; }
    .grille { display:grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
    .carte { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06); display:block; }
    .carte img, .carte .noimg { width:100%; height:130px; object-fit:cover; display:block; }
    .carte .noimg { background:#e7ebf0; display:flex; align-items:center; justify-content:center; font-size:32px; }
    .carte .ci { padding:10px 12px; }
    .carte .ct { font-weight:700; font-size:14px; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .carte .cl { font-size:12px; color:#667; margin-bottom:6px; }
    .carte .cp { font-weight:800; color:#2E7D32; font-size:15px; }
    .carte .cp span { font-size:11px; font-weight:600; color:#7a8699; }
    .pagination { display:flex; gap:12px; align-items:center; justify-content:center; margin:20px 0; color:#556; }
    .pagination a { background:#fff; border:1px solid #dfe4ea; border-radius:8px; padding:6px 12px; font-weight:700; color:#1565C0; }
    .vide { color:#888; text-align:center; padding:30px 0; }
    .hero { padding: 10px 0 4px; }
    .hero p { color:#556; margin:0 0 10px; }
    .foot { text-align:center; color:#9aa5b1; font-size:12px; padding:24px 0; }
  </style>
</head>
<body>
  <a class="topbar" href="/logements/">Loyatrack · Logements</a>
  <div class="wrap">{% block content %}{% endblock %}</div>
  <div class="foot">Loyatrack — trouvez votre prochain logement</div>
</body>
</html>
